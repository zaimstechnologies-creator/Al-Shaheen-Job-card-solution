<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 185" width="100%" height="100%">
  <g stroke="#1e293b" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Front Bumper & Nose -->
    <path d="M 65,26 C 45,26 36,36 36,50 L 36,98 C 36,112 45,122 65,122" fill="#f8fafc"/>
    <path d="M 38,36 C 30,42 30,106 38,112" stroke-width="1.8" />
    
    <!-- Headlights & Fog Lamps -->
    <circle cx="48" cy="40" r="4" fill="#e2e8f0" />
    <circle cx="58" cy="40" r="3.5" fill="#e2e8f0" />
    <circle cx="48" cy="108" r="4" fill="#e2e8f0" />
    <circle cx="58" cy="108" r="3.5" fill="#e2e8f0" />

    <!-- Bonnet / Hood Lines -->
    <path d="M 65,48 L 130,45" stroke="#94a3b8" />
    <path d="M 65,100 L 130,103" stroke="#94a3b8" />

    <!-- Main Outer Body Shell -->
    <path d="M 65,26 L 95,26 C 95,20 100,15 110,15 C 120,15 125,20 125,26 L 295,26 C 295,20 300,15 310,15 C 320,15 325,20 325,26 L 360,26 C 375,26 384,35 384,52 L 384,96 C 384,113 375,122 360,122 L 325,122 C 325,128 320,133 310,133 C 300,133 295,128 295,122 L 125,122 C 125,128 120,133 110,133 C 100,133 95,128 95,122 L 65,122 Z" fill="#ffffff" />

    <!-- Front Windshield -->
    <path d="M 132,30 C 138,42 138,106 132,118 L 150,115 C 154,103 154,45 150,33 Z" fill="#f1f5f9" />

    <!-- Roof -->
    <rect x="158" y="34" width="78" height="80" rx="5" fill="#ffffff" stroke="#64748b" stroke-dasharray="3,2"/>

    <!-- Windows / Doors Outlines (Top side) -->
    <path d="M 155,30 L 195,30 L 195,40 L 155,40 Z" fill="#f1f5f9" stroke="#475569" />
    <path d="M 199,30 L 245,30 L 245,40 L 199,40 Z" fill="#f1f5f9" stroke="#475569" />

    <!-- Windows / Doors Outlines (Bottom side) -->
    <path d="M 155,108 L 195,108 L 195,118 L 155,118 Z" fill="#f1f5f9" stroke="#475569" />
    <path d="M 199,108 L 245,108 L 245,118 L 199,118 Z" fill="#f1f5f9" stroke="#475569" />

    <!-- B-Pillar Center Divider -->
    <line x1="197" y1="26" x2="197" y2="122" stroke="#94a3b8" />

    <!-- Rear Windshield -->
    <path d="M 252,32 C 248,44 248,104 252,116 L 268,116 C 263,104 263,44 268,32 Z" fill="#f1f5f9" />

    <!-- Trunk / Boot with Spare Wheel Indicator -->
    <circle cx="318" cy="74" r="20" fill="#f8fafc" stroke="#475569" stroke-width="1.3" stroke-dasharray="3,2"/>
    <circle cx="318" cy="74" r="10" fill="none" stroke="#94a3b8" stroke-width="1"/>
    <text x="318" y="77" font-size="7" font-family="'Segoe UI', Arial, sans-serif" fill="#64748b" text-anchor="middle" font-weight="bold">SPARE</text>

    <!-- Rear Bumper & Taillights -->
    <path d="M 382,36 C 390,42 390,106 382,112" stroke-width="1.8" />
    <rect x="372" y="32" width="6" height="10" rx="1.5" fill="#ef4444" stroke="#b91c1c" />
    <rect x="372" y="106" width="6" height="10" rx="1.5" fill="#ef4444" stroke="#b91c1c" />

    <!-- 4 Wheels / Tires with rims -->
    <!-- Front Left Wheel -->
    <circle cx="110" cy="18" r="13" fill="#334155" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="110" cy="18" r="6.5" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>

    <!-- Rear Left Wheel -->
    <circle cx="310" cy="18" r="13" fill="#334155" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="310" cy="18" r="6.5" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>

    <!-- Front Right Wheel -->
    <circle cx="110" cy="130" r="13" fill="#334155" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="110" cy="130" r="6.5" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>

    <!-- Rear Right Wheel -->
    <circle cx="310" cy="130" r="13" fill="#334155" stroke="#0f172a" stroke-width="1.8"/>
    <circle cx="310" cy="130" r="6.5" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  </g>

  <!-- Tread Depth Inputs -->
  <g font-family="'Segoe UI', Arial, sans-serif" font-size="8" fill="#334155">
    <!-- Front Left Tread -->
    <text x="24" y="10" font-weight="bold">Tread Depth</text>
    <line x1="24" y1="17" x2="80" y2="17" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" />
    <text x="83" y="17" font-size="7" fill="#64748b">mm</text>

    <!-- Rear Left Tread -->
    <text x="235" y="10" font-weight="bold">Tread Depth</text>
    <line x1="235" y1="17" x2="285" y2="17" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" />
    <text x="288" y="17" font-size="7" fill="#64748b">mm</text>

    <!-- Front Right Tread -->
    <text x="24" y="152" font-weight="bold">Tread Depth</text>
    <line x1="24" y1="160" x2="80" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" />
    <text x="83" y="160" font-size="7" fill="#64748b">mm</text>

    <!-- Rear Right Tread -->
    <text x="235" y="152" font-weight="bold">Tread Depth</text>
    <line x1="235" y1="160" x2="285" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" />
    <text x="288" y="160" font-size="7" fill="#64748b">mm</text>

    <!-- Spare Wheel Tread -->
    <text x="400" y="70" font-weight="bold">Tread Depth</text>
    <line x1="400" y1="78" x2="445" y2="78" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2" />
    <text x="448" y="78" font-size="7" fill="#64748b">mm</text>
  </g>

  <!-- FAULT SYMBOLS (PANEL & PAINT) TABLE -->
  <g font-family="'Segoe UI', Arial, sans-serif" transform="translate(24, 168)">
    <text x="0" y="0" font-size="7.5" font-weight="900" fill="#0f172a" letter-spacing="0.3">FAULT SYMBOLS (PANEL &amp; PAINT):</text>
    <g font-size="7.5" font-weight="bold" transform="translate(0, 11)">
      <text x="0" y="0" fill="#dc2626">D</text>
      <text x="12" y="0" fill="#334155">DENT (ڈینٹ)</text>
      
      <text x="100" y="0" fill="#d97706">S</text>
      <text x="112" y="0" fill="#334155">SCRATCHES (خراش)</text>
      
      <text x="215" y="0" fill="#7c3aed">C</text>
      <text x="227" y="0" fill="#334155">CHIPS (پتھر کے نشان)</text>
      
      <text x="330" y="0" fill="#b91c1c">R</text>
      <text x="342" y="0" fill="#334155">RUST (زنگ)</text>
    </g>
  </g>
</svg>